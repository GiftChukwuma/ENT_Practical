<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-primary bg-gradient">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

      <div class="card border-0 shadow-lg rounded-4">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
              <span class="fs-2 fw-bold">L</span>
            </div>
            <h1 class="h3 fw-bold mb-1">Welcome back</h1>
            <p class="text-body-secondary mb-0">Please sign in to continue</p>
          </div>

          <form class="needs-validation" novalidate>

            <div class="form-floating mb-3">
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              <label for="email">Email address</label>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="input-group mb-3">
              <div class="form-floating flex-grow-1">
                <input type="password" class="form-control" id="password" placeholder="Password" minlength="6" required>
                <label for="password">Password</label>
              </div>
              <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="#" class="link-primary link-underline-opacity-0 link-underline-opacity-100-hover small">Forgot password?</a>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-lg rounded-3 shadow-sm">Sign in</button>
            </div>

          </form>

          <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1 m-0">
            <span class="px-3 text-body-secondary small">or</span>
            <hr class="flex-grow-1 m-0">
          </div>

          <div class="d-grid">
            <button type="button" class="btn btn-outline-secondary rounded-3">Continue with Google</button>
          </div>

          <p class="text-center text-body-secondary mt-4 mb-0">
            Don't have an account?
            <a href="#" class="fw-semibold link-primary link-underline-opacity-0 link-underline-opacity-100-hover">Sign up</a>
          </p>

        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Bootstrap validation
    document.querySelectorAll('.needs-validation').forEach(form => {
      form.addEventListener('submit', e => {
        if (!form.checkValidity()) {
          e.preventDefault();
          e.stopPropagation();
        }
        form.classList.add('was-validated');
      });
    });

    // Show/hide password
    const pw = document.getElementById('password');
    const toggle = document.getElementById('togglePassword');
    toggle.addEventListener('click', () => {
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      toggle.textContent = show ? 'Hide' : 'Show';
    });
  </script>
</body>
</html>
